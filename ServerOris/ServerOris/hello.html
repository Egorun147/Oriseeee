<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;700&amp;display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Afacad, Arial, sans-serif;
            background-color: white;
        }

        header {
            position: absolute;
            top: 35px;
            right: 40px;
            text-align: right;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
            color: #6962f3;
            font-size: 13px;
            font-weight: bold;
        }

        main {
            position: absolute;
            top: 34%;
            width: 100%;
            text-align: center;
        }

        time {
            font-size: 58px;
            font-weight: bold;
        }

        h2 {
            margin-top: 0px;
            color: #6962f3;
            font-size: 25px;
        }

        section {
            position: absolute;
            top: 52%;
            left: 50%;
            width: 540px;
            transform: translateX(-50%);
        }

        section div {
            position: relative;
        }

        section div > img {
            position: absolute;
            top: 14px;
            left: 20px;
            width: 28px;
            height: 28px;
        }

        input {
            font-family: inherit;
            width: 100%;
            height: 56px;
            padding-left: 52px;
            border: 1px solid #ededf0;
            border-radius: 15px;
            background-color: #fbfbfc;
            font-size: 16px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 27px;
        }

        nav a, nav button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            padding: 0;
            border: 1px solid #ededf0;
            border-radius: 15px;
            background-color: #fbfbfc;
            text-decoration: none;
        }

        nav img {
            width: 23px;
            height: 23px;
            object-fit: contain;
        }

        nav button {
            color: #aaaaaf;
            font-size: 27px;
        }

        @media (max-width: 600px) {
            header {
                top: 22px;
                right: 20px;
            }

            header h1 {
                font-size: 21px;
            }

            header p {
                font-size: 10px;
            }

            main {
                top: 35%;
            }

            time {
                font-size: 38px;
            }

            h2 {
                font-size: 17px;
            }

            section {
                top: 71%;
                width: calc(100% - 40px);
            }

            input {
                height: 50px;
                font-size: 15px;
            }

            section div > img {
                top: 11px;
            }

            nav {
                justify-content: space-between;
                gap: 5px;
                margin-top: 20px;
            }

            nav a, nav button {
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }

            nav a:nth-child(6), nav button {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>36°</h1>
        <p>Ahmedabad</p>
    </header>

    <main>
        <time>09:11:01</time>
        <h2>Good Morning, Saad.</h2>
    </main>

    <section>
        <div>
            <img src="search-01.svg" alt="">
            <input type="text" placeholder="Search">
        </div>

        <nav>
            <a href="https://www.youtube.com">
                <img src="https://www.youtube.com/favicon.ico" alt="YouTube">
            </a>
            <a href="https://chatgpt.com">
                <img src="https://www.chatgpt.com/favicon.ico" alt="ChatGPT">
            </a>
            <a href="https://www.geeksforgeeks.org">
                <img src="https://www.geeksforgeeks.org/favicon.ico" alt="GeeksforGeeks">
            </a>
            <a href="https://www.deepseek.com">
                <img src="https://www.deepseek.com/favicon.ico" alt="DeepSeek">
            </a>
            <a href="https://github.com">
                <img src="https://github.com/favicon.ico" alt="GitHub">
            </a>
            <a href="https://www.linkedin.com">
                <img src="https://www.linkedin.com/favicon.ico" alt="LinkedIn">
            </a>
            <button type="button">+</button>
        </nav>
    </section>
</body>
</html>
